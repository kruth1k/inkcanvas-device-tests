name: InkCanvas device tests
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Private-repo run id that produced the app-debug-apk artifact
        required: true
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Download debug APK from the private repo (read-only token)
        env:
          GH_TOKEN: ${{ secrets.INKCANVAS_READ_TOKEN }}
        run: |
          gh run download "${{ inputs.artifact_run_id }}" -R kruth1k/inkcanvas -n app-debug-apk
          ls -la app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app-debug.apk
            adb shell pm clear dev.kruthik.inkcanvas
            adb shell pm grant dev.kruthik.inkcanvas android.permission.RECORD_AUDIO
            adb shell wm size 1280x800
            adb shell wm density 160
            timeout 420 flutter drive --use-application-binary=app-debug.apk --driver=test_driver/integration_test.dart --target=integration_test/tablet_test.dart -d emulator-5554 --keep-app-running --timeout=360
      # Intentionally no artifact uploads: logs stay in the run, nothing is published.
